name: Build Saul APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (preinstalled, no download action)
        run: |
          set -x
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls "$ANDROID_HOME/cmdline-tools" || true
          SDMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            # fall back to newest versioned dir
            SDMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)
          fi
          echo "sdkmanager=$SDMANAGER"
          yes | "$SDMANAGER" --licenses || true
          "$SDMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saul-apk
          path: app/build/outputs/apk/release/app-release.apk
